# Render Blueprint: one free web service built from the Dockerfile.
# After creating it, set MONGODB_URI in the dashboard (free MongoDB Atlas M0 cluster).
services:
  - type: web
    name: climate-hazard-analyzer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: climate_hazards
